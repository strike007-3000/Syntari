name: windows
on:
  push: { branches: [main], tags: ['v*'] } # a v* tag builds and publishes a pre-release
  pull_request:
  workflow_dispatch: # manual run also builds the installer and uploads it as an artifact
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      # Only installer builds need the SDK's build.rs to download foundry_local.dll; keep in step with the foundry-local-sdk crate version.
      FOUNDRY_LOCAL_RUNTIME_VERSION: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '2.1.0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: choco install nasm -y --no-progress && echo "C:\Program Files\NASM" >> $env:GITHUB_PATH # SQLCipher's vendored OpenSSL
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Stage Foundry runtime DLLs for the installer (MIT; see src-tauri/licenses)
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          # The SDK's build.rs downloads foundry_local.dll + ONNX Runtime/GenAI into its OUT_DIR.
          $dll = Get-ChildItem src-tauri/target -Recurse -Filter foundry_local.dll | Select-Object -First 1
          if (-not $dll) { throw "foundry_local.dll not found in build output" }
          New-Item -ItemType Directory -Force src-tauri/native | Out-Null
          Copy-Item "$($dll.DirectoryName)/*.dll" src-tauri/native/
          Get-ChildItem src-tauri/native
      - if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        run: npm run tauri build -- --config src-tauri/tauri.windows-bundle.conf.json
      - name: Verify the installer contains the runtime
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $list = 7z l $exe.FullName | Out-String
          if ($list -notmatch "foundry_local.dll") { Write-Host $list; throw "foundry_local.dll missing from installer" }
      - name: Smoke-test a silent install
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\Syntari" # NSIS default install mode is per-user
          foreach ($f in "syntari.exe", "foundry_local.dll") {
            if (-not (Test-Path "$dir\$f")) { Get-ChildItem $dir -ErrorAction SilentlyContinue; throw "$f missing after install" }
          }
      - if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: syntari-windows
          path: src-tauri/target/release/bundle/**/*.exe
  publish:
    needs: build
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can write; the build job runs third-party actions read-only
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('windows-build-{0}', github.run_number) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: syntari-windows
          path: installer
      - name: Publish the installer as a pre-release
        run: |
          exe=$(find installer -name '*.exe' | head -n1)
          # a rerun keeps run_number, so replace the asset instead of failing on the existing release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$exe" --clobber
          else
            gh release create "$TAG" "$exe" --prerelease --target "${{ github.sha }}" --title "$TAG" --notes "Unsigned test installer from ${{ github.ref_name }} @ ${{ github.sha }}. SmartScreen: More info > Run anyway."
          fi
