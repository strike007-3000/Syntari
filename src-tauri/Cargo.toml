[package]
name = "syntari"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "syntari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
cpal = "0.15"
foundry-local-sdk = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
fastrand = "2"
sha2 = "0.10"
libc = "0.2"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.2"
screencapturekit-sys = "0.2"

# Dev builds hash ~4 GB of model weights on every launch; unoptimized sha2 takes minutes.
[profile.dev.package."*"]
opt-level = 3
